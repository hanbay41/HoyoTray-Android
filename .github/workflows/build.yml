# Builds a signed HoyoTray.apk on GitHub's servers.
# - Publishing a release attaches the APK to that release.
# - "Run workflow" on the Actions tab builds it as a downloadable artifact.
# Needs repo secrets KEYSTORE_BASE64 (the .jks, base64) and KEYSTORE_PASSWORD.
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing key
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          HOYOTRAY_KEYSTORE: ${{ runner.temp }}/release.jks
          HOYOTRAY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HOYOTRAY_KEY_ALIAS: hoyotray
          HOYOTRAY_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - run: cp app/build/outputs/apk/release/app-release.apk HoyoTray.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HoyoTray
          path: HoyoTray.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" HoyoTray.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
